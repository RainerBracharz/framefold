name: iOS Build

on:
  push:
    branches: [main, mac-catalyst]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Logik-Tests, Speicher-Tests, iOS- und Mac-Build
    runs-on: macos-latest
    steps:
      # Auf einen festen Stand gepinnt (v4) – ein verschobener Tag kann so
      # keinen fremden Code in einen Job mit Schreibrecht bringen. Das Token
      # bleibt nicht in .git liegen, während Build und Tests laufen.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Xcode-Version
        run: xcodebuild -version | tee /tmp/xcode-version.txt

      - name: Logik-Tests (Algorithms + Models)
        run: |
          set -o pipefail
          swiftc -o /tmp/fftests FrameFold/Algorithms.swift FrameFold/Models.swift linux-tests/main.swift 2>&1 | tee /tmp/tests-compile.log
          /tmp/fftests 2>&1 | tee /tmp/tests-run.log

      - name: iOS-Build (ohne Signing)
        if: always()
        run: |
          set -o pipefail
          xcodebuild \
            -project FrameFold.xcodeproj \
            -scheme FrameFold \
            -destination 'generic/platform=iOS' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee /tmp/build.log

      - name: Mac-Build (Mac Catalyst, ohne Signing)
        if: always()
        run: |
          set -o pipefail
          xcodebuild \
            -project FrameFold.xcodeproj \
            -scheme FrameFold \
            -destination 'generic/platform=macOS,variant=Mac Catalyst' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee /tmp/build-mac.log

      # Projektspeicher (Papierkorb, Verwerfen, Wiederherstellen): hier geht
      # es um die Werke der Nutzer. Läuft als Mac-Catalyst-Test – das braucht
      # keinen Simulator, nur eine Ad-hoc-Signatur.
      - name: Speicher-Tests (ProjectStore)
        if: always()
        run: |
          set -o pipefail
          xcodebuild test \
            -project FrameFold.xcodeproj \
            -scheme FrameFold \
            -destination 'platform=macOS,variant=Mac Catalyst' \
            -only-testing:FrameFoldTests \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= \
            2>&1 | tee /tmp/unit-tests.log | grep -E "Test Case|Executed|error:|TEST (SUCCEEDED|FAILED)"

      - name: Ergebnis in ci-results-Branch veröffentlichen
        if: always()
        run: |
          mkdir -p /tmp/ci-out
          echo "status=${{ job.status }}" > /tmp/ci-out/STATUS.txt
          echo "commit=$GITHUB_SHA" >> /tmp/ci-out/STATUS.txt
          echo "run=$GITHUB_RUN_NUMBER" >> /tmp/ci-out/STATUS.txt
          cp /tmp/xcode-version.txt /tmp/ci-out/ 2>/dev/null || true
          cp /tmp/tests-compile.log /tmp/tests-run.log /tmp/ci-out/ 2>/dev/null || true
          if [ -f /tmp/build-mac.log ]; then
            grep -E "error:" /tmp/build-mac.log > /tmp/ci-out/build-mac-errors.txt || true
          fi
          if [ -f /tmp/unit-tests.log ]; then
            grep -E "Test Case|Executed|error:|TEST (SUCCEEDED|FAILED)" /tmp/unit-tests.log > /tmp/ci-out/unit-tests.txt || true
          fi
          if [ -f /tmp/build.log ]; then
            grep -E "error:|warning:" /tmp/build.log > /tmp/ci-out/build-errors.txt || true
            tail -c 150000 /tmp/build.log > /tmp/ci-out/build-tail.log
          fi
          cd /tmp/ci-out
          git init -q -b ci-results
          git config user.email "ci@framefold.local"
          git config user.name "FrameFold CI"
          git add -A
          git commit -qm "CI-Ergebnis Run $GITHUB_RUN_NUMBER ($GITHUB_SHA)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-results
